name: declared process unit API
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: unit-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: implemented unit API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, implementation: openkal-linux, revision: 5d2217424c25f072eb7bb8a7f6c2ea95b4bfa0df }
          - { os: macos-15, implementation: openkal-macos, revision: 0ad90826b6097c806bc7db7b0c3579acd231b3b7 }
          - { os: windows-2025, implementation: openkal-windows, revision: 664628d0a01a38d028f59fd8c660891efa218679 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcpplibs/${{ matrix.implementation }}
          ref: ${{ matrix.revision }}
          path: backend
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Run the implemented ABI against its actual native backend
        shell: bash
        run: python .github/checks/build_job_observer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: declared-unit-${{ matrix.os }}
          path: |
            unit-api-build/*.jsonl
            unit-api-build/retire-boundaries.json
