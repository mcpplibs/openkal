name: declared process unit API
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: unit-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: implemented unit API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, implementation: openkal-linux, revision: 0e9f3ccd7a1f473a2aeb399f727efec7196bae46 }
          - { os: macos-15, implementation: openkal-macos, revision: e1534d674c980ed839903bf4be880efee1a55e3a }
          - { os: windows-2025, implementation: openkal-windows, revision: d09f316a35814c0cbde3a2add793659ea439c6a0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcpplibs/${{ matrix.implementation }}
          ref: ${{ matrix.revision }}
          path: backend
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Run the implemented ABI against its actual native backend
        shell: bash
        run: python .github/checks/build_job_observer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: declared-unit-${{ matrix.os }}
          path: |
            unit-api-build/*.jsonl
            unit-api-build/retire-boundaries.json
