                   mcpp toolchain default "$spec" ;;
          esac
          mcpp toolchain list

      # The set `substitution': one source over two implementations
      # (examples/substitution), the surface checker rejecting an unspecified
      # name, and the interface list derived from an artefact. Each case works
      # on a copy of the example, so the checkout is not written.
      - uses: ./.github/actions/mtest
      - name: Substitution holds, and the surface checker fails when it should
        run: |
          "$MTEST" run --set substitution --group "$GITHUB_RUN_ID"
          "$MTEST" report --format md --group "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
